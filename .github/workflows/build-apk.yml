name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build HelioBoost G99 APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install npm dependencies
        run: npm ci || npm install

      - name: Build web production bundle
        run: npm run build

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Build Debug APK with Gradle
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename output APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk HelioBoost-G99.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HelioBoost-G99-APK
          path: HelioBoost-G99.apk
          retention-days: 90

      - name: Publish APK to GitHub Releases
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: HelioBoost G99 v1.0.${{ github.run_number }}
          body: |
            إصدار Android APK لتطبيق **HelioBoost G99 — مسرع ألعاب هيلو G99**.
            قم بتحميل ملف `HelioBoost-G99.apk` وتثبيته على جهاز الأندرويد.
          files: HelioBoost-G99.apk
          draft: false
          prerelease: false
